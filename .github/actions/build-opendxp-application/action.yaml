name: Build an OpenDXP application
description: Builds an installed OpenDXP application around a package with the commands of open-dxp/test-foundation, the same way the testkit does.

inputs:
    package:
        description: Where the package under test is checked out.
        required: false
        default: .
    application:
        description: Where to build the application.
        required: false
        default: application
    opendxp_version:
        description: A version of open-dxp/opendxp to force, instead of the one the package asks for.
        required: false
    composer_repository:
        description: A composer repository to offer besides packagist, as a url.
        required: false
        default: ''
    database_host:
        description: The host the database service answers on.
        required: false
        default: '127.0.0.1'
    database_port:
        description: The port the database service answers on.
        required: false
        default: '33006'
    database_user:
        description: A user that may create the schema.
        required: false
        default: root
    database_password:
        description: That user's password. Empty is what a service container gives you.
        required: false
        default: ''
    database_name:
        description: The database to install into. It has to exist already.
        required: false
        default: opendxp_test

runs:
    using: composite
    steps:
        -   name: Build the application around the package
            shell: bash
            run: |
                set -eu

                package=$(cd "${{ inputs.package }}" && pwd)
                foundation=$(jq -r '."require-dev"."open-dxp/test-foundation" // empty' "$package/composer.json")

                if [ -z "$foundation" ]; then
                    echo "$package does not require open-dxp/test-foundation in require-dev." >&2
                    exit 1
                fi

                mkdir -p "${{ inputs.application }}"
                cd "${{ inputs.application }}"

                echo '{"minimum-stability": "dev", "prefer-stable": true}' > composer.json

                if [ -n '${{ inputs.composer_repository }}' ]; then
                    composer config repositories.private composer '${{ inputs.composer_repository }}'
                fi

                composer require --no-interaction --no-progress --no-plugins --no-scripts "open-dxp/test-foundation:$foundation"

                if [ -n '${{ inputs.opendxp_version }}' ]; then
                    vendor/bin/opendxp-test bundle "$package" --opendxp '${{ inputs.opendxp_version }}'
                else
                    vendor/bin/opendxp-test bundle "$package"
                fi

                mkdir -p var/report

        -   name: Install OpenDXP
            shell: bash
            working-directory: ${{ inputs.application }}
            env:
                DATABASE_URL: mysql://${{ inputs.database_user }}:${{ inputs.database_password }}@${{ inputs.database_host }}:${{ inputs.database_port }}/${{ inputs.database_name }}
            run: vendor/bin/opendxp-test install
