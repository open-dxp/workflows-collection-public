name: Reusable composer vulnerabilities check

on:
    workflow_call:
        inputs:
            php-version:
                required: false
                default: '8.3'
                type: string
            branch:
                required: false
                default: ''
                type: string
                description: Branch to audit. Empty audits the ref of the calling event.
            ignore-list:
                required: false
                type: string
                description: Ignore list type (e.g., public)
            composer_repository:
                description: A composer repository to offer besides packagist, as a url.
                required: false
                type: string
                default: ''
        secrets:
            COMPOSER_AUTH:
                required: false
            TEAMS_COMPOSER_VULNERABILITY_URI:
                required: false

permissions:
    contents: read

jobs:
    composer-checks:
        name: Composer Checks
        runs-on: ubuntu-latest
        env:
            TEAMS_URI: ${{ secrets.TEAMS_COMPOSER_VULNERABILITY_URI }}
        steps:
            -   name: Checkout package
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.branch }}

            # A new advisory turns the daily run red. A pull request only fails for a change of its own.
            -   name: Skip pull request without composer.json change
                if: github.event_name == 'pull_request'
                env:
                    BASE: ${{ github.event.pull_request.base.sha }}
                run: |
                    git fetch --quiet --depth=1 origin "$BASE"
                    if git diff --quiet "$BASE" HEAD -- composer.json; then
                        echo "SKIP=true" >> "$GITHUB_ENV"
                        echo "The pull request keeps composer.json." >> "$GITHUB_STEP_SUMMARY"
                    fi

            # The scripts come from the same commit of this repository as the workflow the package calls.
            -   name: Checkout scripts
                if: env.SKIP != 'true'
                uses: actions/checkout@v7
                with:
                    repository: open-dxp/workflows-collection-public
                    ref: ${{ job.workflow_sha }}
                    path: .workflows-collection

            -   name: Install PHP
                if: env.SKIP != 'true'
                uses: shivammathur/setup-php@v2
                with:
                    coverage: 'none'
                    php-version: ${{ inputs.php-version }}

            -   name: Cache composer downloads
                if: env.SKIP != 'true'
                uses: actions/cache@v6
                with:
                    path: ~/.cache/composer
                    key: composer-${{ inputs.php-version }}-${{ hashFiles('composer.json') }}
                    restore-keys: composer-${{ inputs.php-version }}-

            # Composer cannot read the version of a pull request checkout. A version branch names it. A pull request
            # in a stack targets another pull request, so the default branch names it then.
            -   name: Name the version of the checkout
                env:
                    BRANCH: ${{ github.base_ref || github.ref_name }}
                    DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                run: |
                    [[ $BRANCH =~ ^[0-9]+\.([0-9]+|x)$ ]] || BRANCH=$DEFAULT_BRANCH
                    echo "COMPOSER_ROOT_VERSION=$BRANCH-dev" >> "$GITHUB_ENV"

            -   name: Check for security vulnerabilities
                if: env.SKIP != 'true'
                env:
                    COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
                    COMPOSER_REPOSITORY: ${{ inputs.composer_repository }}
                    IGNORE_LIST: ${{ inputs.ignore-list }}
                    REPORT: ${{ runner.temp }}/composer-audit.md
                run: .workflows-collection/security/composer-audit.sh

            -   name: Write report
                if: always() && env.SKIP != 'true'
                env:
                    REPORT: ${{ runner.temp }}/composer-audit.md
                run: |
                    [ -f "$REPORT" ] || exit 0
                    cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
                    {
                      echo "AUDIT_REPORT<<EOF"
                      cat "$REPORT"
                      echo "EOF"
                    } >> "$GITHUB_ENV"

            -   name: Send report to Microsoft Teams
                if: failure() && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) && env.TEAMS_URI != ''
                uses: aliencube/microsoft-teams-actions@v0.8.0
                with:
                    webhook_uri: ${{ env.TEAMS_URI }}
                    title: ${{ github.repository }}@${{ inputs.branch || github.ref_name }} - vulnerabilities report
                    summary: ${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}
                    text: |
                        Please check the following link for details:
                        ${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}

                        ${{ env.AUDIT_REPORT }}
