name: Static analysis

on:
    workflow_call:
        inputs:
            php_version:
                required: true
                type: string
            database:
                required: false
                type: string
                default: 'mysql:8.4'
            server_version:
                required: false
                type: string
                default: '8.4'
            experimental:
                required: false
                type: boolean
                default: false
            opendxp_version:
                required: false
                type: string
            composer_repositories:
                description: Repositories to offer composer besides packagist, as a json object keyed by name.
                required: false
                type: string
            generate_baseline:
                description: On a failure, attach a baseline of everything found.
                required: false
                type: boolean
                default: false
            execute_post_checkout_action:
                required: false
                type: boolean
                default: false

        secrets:
            CLA_ACTION_ACCESS_TOKEN:
                required: false
            COMPOSER_AUTH:
                required: false
            OPENDXP_INSTANCE_IDENTIFIER:
                required: false
            OPENDXP_ENCRYPTION_SECRET:
                required: false

jobs:
    static-analysis:
        name: Static analysis
        runs-on: ubuntu-latest
        continue-on-error: ${{ inputs.experimental == true }}
        concurrency:
            group: static-analysis-${{ github.workflow }}-${{ github.ref }}-${{ inputs.php_version }}-${{ inputs.opendxp_version }}
            cancel-in-progress: true

        env:
            APP_ENV: test
            APP_DEBUG: '1'
            APP_SECRET: test
            DATABASE_URL: "mysql://root@127.0.0.1:33006/opendxp_test"
            DATABASE_SERVER_VERSION: ${{ inputs.server_version }}
            TEST_TIMEZONE: 'Europe/Zurich'
            TEST_DOMAIN: 'opendxp.test'
            OPENDXP_INSTANCE_IDENTIFIER: ${{ secrets.OPENDXP_INSTANCE_IDENTIFIER }}
            OPENDXP_ENCRYPTION_SECRET: ${{ secrets.OPENDXP_ENCRYPTION_SECRET }}

        services:
            database:
                image: ${{ inputs.database }}
                ports:
                    - 33006:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=12
                    --health-start-period=30s
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes

        steps:
            -   name: Checkout the package
                uses: actions/checkout@v7
                with:
                    path: package

            -   name: Configure Git for PAT
                run: |
                    git config --global url."https://x-access-token:${{ secrets.CLA_ACTION_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

            -   name: Run Post Checkout Action
                if: inputs.execute_post_checkout_action
                uses: ./package/.github/actions/post-checkout-action
                with:
                    cla_action_access_token: ${{ secrets.CLA_ACTION_ACCESS_TOKEN }}

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: none
                    extensions: imagick, intl
                    ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
                    php-version: ${{ inputs.php_version }}

            -   name: Prepare the database
                run: |
                    mysql -h 127.0.0.1 -P 33006 -u root -e "SET GLOBAL max_allowed_packet=32505856;"
                    # This database is gone when the job ends, so it does not need to survive
                    # a crash. By default MySQL waits for the disk twice per commit.
                    mysql -h 127.0.0.1 -P 33006 -u root -e "SET GLOBAL innodb_flush_log_at_trx_commit=2;" || true
                    mysql -h 127.0.0.1 -P 33006 -u root -e "SET GLOBAL sync_binlog=0;" || true
                    mysql -h 127.0.0.1 -P 33006 -u root -e "CREATE DATABASE opendxp_test CHARSET=utf8mb4;"

            -   name: Cache the composer downloads
                uses: actions/cache@v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ inputs.php_version }}-${{ hashFiles('package/composer.json') }}
                    restore-keys: composer-${{ inputs.php_version }}-

            -   name: Build the application
                uses: open-dxp/workflows-collection-public/.github/actions/build-opendxp-application@main
                env:
                    COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
                with:
                    opendxp_version: ${{ inputs.opendxp_version }}
                    composer_repositories: ${{ inputs.composer_repositories }}

            -   name: Run phpstan
                id: phpstan
                working-directory: application
                run: |
                    package="vendor/$(jq -r .name ../package/composer.json)"
                    echo "package=$package" >> $GITHUB_OUTPUT
                    # The sources are named here on purpose. Without them phpstan reads no files
                    # and still reports success.
                    vendor/bin/phpstan analyse --memory-limit=-1 -c "$package/phpstan.neon" "$package/src"

            -   name: Generate a baseline
                if: failure() && inputs.generate_baseline
                working-directory: application
                run: |
                    package="${{ steps.phpstan.outputs.package }}"
                    vendor/bin/phpstan analyse --memory-limit=-1 -c "$package/phpstan.neon" "$package/src" \
                        --generate-baseline "$GITHUB_WORKSPACE/phpstan-baseline.neon"

            -   name: Attach the baseline
                if: failure() && inputs.generate_baseline
                uses: actions/upload-artifact@v4
                with:
                    name: "phpstan-baseline (PHP ${{ inputs.php_version }})"
                    if-no-files-found: ignore
                    path: ${{ github.workspace }}/phpstan-baseline.neon
