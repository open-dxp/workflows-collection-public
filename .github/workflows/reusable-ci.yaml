name: CI

on:
    workflow_call:
        inputs:
            composer_repository:
                description: A composer repository to offer besides packagist, as a url.
                required: false
                type: string
                default: ''
            enable_browser:
                required: false
                type: boolean
                default: false
            enable_opensearch_service:
                required: false
                type: boolean
                default: false
            enable_redis_service:
                required: false
                type: boolean
                default: false
            install_ffmpeg:
                required: false
                type: boolean
                default: false
            install_ghostscript_and_pdfinfo:
                required: false
                type: boolean
                default: false
            taint_sources:
                description: The directories of the taint analysis, separated by spaces.
                required: false
                type: string
                default: 'src'

concurrency:
    group: ci-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            tests: ${{ steps.plan.outputs.tests }}
            static_analysis: ${{ steps.plan.outputs.static_analysis }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            # A pull request has tested the code before its merge, so a push runs the security checks only.
            # A pull request that changes docs only skips the tests and the analysis. The workflow itself
            # still runs, because the required check must report in every pull request.
            -   id: plan
                env:
                    EVENT: ${{ github.event_name }}
                    BASE: ${{ github.event.pull_request.base.sha }}
                    HEAD: ${{ github.event.pull_request.head.sha }}
                run: |
                    case "$EVENT" in
                        pull_request)
                            if git diff --name-only "$BASE...$HEAD" | grep -qvE '\.md$|^docs?/'; then
                                tests=true
                            else
                                tests=false
                            fi
                            static_analysis=$tests
                            ;;
                        workflow_dispatch)
                            tests=true
                            static_analysis=true
                            ;;
                        schedule)
                            tests=false
                            # The analysis runs on Mondays only.
                            static_analysis=$([ "$(date -u +%u)" = 1 ] && echo true || echo false)
                            ;;
                        *)
                            tests=false
                            static_analysis=false
                            ;;
                    esac
                    echo "tests=$tests" >> "$GITHUB_OUTPUT"
                    echo "static_analysis=$static_analysis" >> "$GITHUB_OUTPUT"

    setup-tests-matrix:
        needs: plan
        if: needs.plan.outputs.tests == 'true'
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            -   uses: actions/checkout@v7

            -   id: matrix
                uses: open-dxp/workflows-collection-public/.github/actions/test-matrix@main
                with:
                    configuration: tests-configuration

    pest-tests:
        needs: setup-tests-matrix
        strategy:
            matrix: ${{ fromJson(needs.setup-tests-matrix.outputs.matrix) }}
        uses: open-dxp/workflows-collection-public/.github/workflows/reusable-pest-tests.yaml@main
        with:
            composer_repository: ${{ inputs.composer_repository }}
            enable_browser: ${{ inputs.enable_browser }}
            enable_opensearch_service: ${{ inputs.enable_opensearch_service }}
            enable_redis_service: ${{ inputs.enable_redis_service }}
            install_ffmpeg: ${{ inputs.install_ffmpeg }}
            install_ghostscript_and_pdfinfo: ${{ inputs.install_ghostscript_and_pdfinfo }}
            php_version: ${{ matrix.matrix.php-version }}
            database: ${{ matrix.matrix.database }}
            server_version: ${{ matrix.matrix.server_version }}
            dependencies: ${{ matrix.matrix.dependencies }}
            experimental: ${{ matrix.matrix.experimental }}
            opendxp_version: ${{ matrix.matrix.opendxp_version }}
        secrets: inherit

    setup-static-analysis-matrix:
        needs: plan
        if: needs.plan.outputs.static_analysis == 'true'
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            -   uses: actions/checkout@v7

            -   id: matrix
                uses: open-dxp/workflows-collection-public/.github/actions/test-matrix@main
                with:
                    configuration: phpstan-configuration

    static-analysis:
        needs: setup-static-analysis-matrix
        strategy:
            matrix: ${{ fromJson(needs.setup-static-analysis-matrix.outputs.matrix) }}
        uses: open-dxp/workflows-collection-public/.github/workflows/reusable-static-analysis.yaml@main
        with:
            composer_repository: ${{ inputs.composer_repository }}
            php_version: ${{ matrix.matrix.php-version }}
            experimental: ${{ matrix.matrix.experimental }}
            opendxp_version: ${{ matrix.matrix.opendxp_version }}
        secrets: inherit

    composer-vulnerabilities:
        uses: open-dxp/workflows-collection-public/.github/workflows/reusable-composer-vulnerabilities.yaml@main
        with:
            composer_repository: ${{ inputs.composer_repository }}
        secrets: inherit

    taint-analysis:
        uses: open-dxp/workflows-collection-public/.github/workflows/reusable-taint-analysis.yaml@main
        with:
            sources: ${{ inputs.taint_sources }}
            composer_repository: ${{ inputs.composer_repository }}
        permissions:
            contents: read
            security-events: write
        secrets: inherit

    secret-scan:
        uses: open-dxp/workflows-collection-public/.github/workflows/reusable-secret-scan.yaml@main

    # The CI ruleset of the organisation requires this check in pull requests.
    # It fails when any job above fails or is cancelled.
    ci-passed:
        if: always()
        needs:
            - plan
            - setup-tests-matrix
            - pest-tests
            - setup-static-analysis-matrix
            - static-analysis
            - composer-vulnerabilities
            - taint-analysis
            - secret-scan
        runs-on: ubuntu-latest
        steps:
            -   env:
                    RESULTS: ${{ join(needs.*.result, ' ') }}
                run: |
                    for result in $RESULTS; do
                        if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
                            echo "A job ended with the result $result." >&2
                            exit 1
                        fi
                    done
