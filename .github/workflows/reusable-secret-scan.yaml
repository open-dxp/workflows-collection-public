name: Secret scan

on:
    workflow_call:

permissions:
    contents: read

jobs:
    secret-scan:
        name: Secret scan
        # A scheduled run adds no commit to search.
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            # The scripts come from the same commit of this repository as the workflow the package calls.
            -   name: Checkout scripts
                uses: actions/checkout@v7
                with:
                    repository: open-dxp/workflows-collection-public
                    ref: ${{ job.workflow_sha }}
                    path: .workflows-collection

            # The push of a new branch has no previous commit. Its commits are compared with the default branch.
            -   name: Search commits for secrets
                env:
                    EVENT: ${{ github.event_name }}
                    BASE: ${{ github.event.pull_request.base.sha }}
                    HEAD: ${{ github.event.pull_request.head.sha }}
                    BEFORE: ${{ github.event.before }}
                    AFTER: ${{ github.sha }}
                    DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                    REPORT: ${{ runner.temp }}/secret-scan.md
                run: |
                    case "$EVENT" in
                        pull_request) RANGE="$BASE..$HEAD" ;;
                        push) [[ "$BEFORE" =~ ^0+$ ]] && RANGE="origin/$DEFAULT_BRANCH..$AFTER" || RANGE="$BEFORE..$AFTER" ;;
                        *) RANGE="" ;;
                    esac
                    RANGE="$RANGE" .workflows-collection/security/secret-scan.sh

            -   name: Write report
                if: always()
                env:
                    REPORT: ${{ runner.temp }}/secret-scan.md
                run: |
                    [ -f "$REPORT" ] || exit 0
                    cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
